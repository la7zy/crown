<!doctype html>
<!--
  The episode page of the live site. reader.js unlocks the episode named in the address
  (ep.html?e=01) and then loads the reader, which shows the story with its scenes.
  This file is copied into the site by:  node prototype/publish.mjs

  The policy below lets scripts come from this site only. 'unsafe-eval' is there because the
  scenes of an episode travel inside its locked file and are started from there by reader.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#02050a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>The Price of a Crown</title>
<link rel="stylesheet" href="immersive.css">
<link rel="stylesheet" href="after.css">
<link rel="stylesheet" href="reader.css">
</head>
<body class="locked">
<div id="stage" aria-hidden="true">
  <canvas id="fill" width="72" height="90"></canvas>
  <canvas id="amb" width="360" height="450"></canvas>
</div>

<main id="story"><p class="missing">Opening the episode.</p></main>
<noscript><p class="missing">This page needs JavaScript to open an episode.</p></noscript>

<div id="def" role="status" aria-live="polite" hidden><span id="deft"></span><button type="button" id="defx">Close</button></div>
<div id="ctl">
  <button type="button" id="motion" class="icon" data-state="playing">
    <svg class="i-pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
    <svg class="i-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
  </button>
  <button type="button" id="watch" hidden>Watch scene</button>
</div>

<script src="reader.js"></script>
</body>
</html>
